      <stop offset="28%" stop-color="#CBD5E1"/>
      <stop offset="52%" stop-color="#FFFFFF"/>
      <stop offset="76%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="silverDark" x1="0%" y1="0%" x2="100%" y2="100%">
